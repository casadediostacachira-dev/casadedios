<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <title>Radio Tacachira</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%; overflow: hidden;
            background: #0a0a0f; color: #e0e0e0;
            position: fixed; width: 100%;
        }

        .app-container {
            position: relative;
            width: 100%; height: 100%;
            max-width: 480px; margin: 0 auto;
            background: linear-gradient(180deg, #0a0a0f 0%, #0f0a18 50%, #0a0a0f 100%);
            overflow: hidden;
            display: flex; flex-direction: column;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
        }

        .animated-bg {
            position: absolute; inset: 0; z-index: 0;
            overflow: hidden; pointer-events: none;
        }
        .bg-orb {
            position: absolute; border-radius: 50%;
            filter: blur(60px); opacity: 0.4;
            transition: opacity 0.5s ease;
        }
        .bg-orb.orb-1 {
            width: 300px; height: 300px;
            background: radial-gradient(circle, #d4af37, transparent);
            top: -80px; left: -80px;
            animation: floatOrb1 12s ease-in-out infinite;
        }
        .bg-orb.orb-2 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #8a2be2, transparent);
            bottom: -100px; right: -100px;
            animation: floatOrb2 15s ease-in-out infinite;
        }
        .bg-orb.orb-3 {
            width: 250px; height: 250px;
            background: radial-gradient(circle, #ff4d4d, transparent);
            top: 40%; left: 50%;
            transform: translate(-50%, -50%);
            animation: floatOrb3 18s ease-in-out infinite;
            opacity: 0.2;
        }
        @keyframes floatOrb1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(40px,60px) scale(1.2)} }
        @keyframes floatOrb2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-50px,-40px) scale(1.3)} }
        @keyframes floatOrb3 { 0%,100%{transform:translate(-50%,-50%) scale(1);opacity:0.2} 50%{transform:translate(-50%,-50%) scale(1.5);opacity:0.4} }

        .app-container.playing .bg-orb { opacity: 0.7; }
        .app-container.playing .bg-orb.orb-3 { opacity: 0.5; }

        .wave-rings {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1; pointer-events: none;
        }
        .wave-ring {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            border: 2px solid rgba(212, 175, 55, 0.4);
            opacity: 0;
        }
        .app-container.playing .wave-ring { animation: pulseRing 3s ease-out infinite; }
        .app-container.playing .wave-ring:nth-child(1) { animation-delay: 0s; }
        .app-container.playing .wave-ring:nth-child(2) { animation-delay: 0.6s; }
        .app-container.playing .wave-ring:nth-child(3) { animation-delay: 1.2s; }
        .app-container.playing .wave-ring:nth-child(4) { animation-delay: 1.8s; }
        @keyframes pulseRing {
            0% { width: 100px; height: 100px; opacity: 0.8; border-color: rgba(212,175,55,0.8); }
            100% { width: 500px; height: 500px; opacity: 0; border-color: rgba(212,175,55,0); }
        }

        .bg-equalizer {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 200px;
            display: flex; align-items: flex-end; justify-content: space-around;
            gap: 4px; padding: 0 10px;
            z-index: 1; opacity: 0.15; pointer-events: none;
        }
        .bg-equalizer .bg-bar {
            flex: 1;
            background: linear-gradient(to top, #d4af37, #f7e38a);
            border-radius: 4px 4px 0 0;
            height: 10%; transition: height 0.3s ease;
        }
        .app-container.playing .bg-equalizer { opacity: 0.4; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(1) { animation: bgBounce 1.2s ease-in-out infinite; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(2) { animation: bgBounce 0.9s ease-in-out infinite 0.1s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(3) { animation: bgBounce 1.5s ease-in-out infinite 0.2s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(4) { animation: bgBounce 1.1s ease-in-out infinite 0.3s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(5) { animation: bgBounce 1.3s ease-in-out infinite 0.4s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(6) { animation: bgBounce 0.8s ease-in-out infinite 0.5s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(7) { animation: bgBounce 1.4s ease-in-out infinite 0.15s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(8) { animation: bgBounce 1.0s ease-in-out infinite 0.25s; }
        .app-container.playing .bg-equalizer .bg-bar:nth-child(9) { animation: bgBounce 1.25s ease-in-out infinite 0.35s; }
        @keyframes bgBounce { 0%,100%{height:10%} 50%{height:90%} }

        .app-content {
            position: relative; z-index: 2;
            flex: 1;
            display: flex; flex-direction: column;
            padding: 20px; overflow-y: auto;
        }
        .app-content::-webkit-scrollbar { width: 4px; }
        .app-content::-webkit-scrollbar-thumb { background: rgba(212,175,55,0.3); border-radius: 2px; }

        .app-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0 20px; flex-shrink: 0;
        }
        .app-header .brand { display: flex; align-items: center; gap: 10px; }
        .app-header .brand .logo-mini {
            width: 40px; height: 40px; border-radius: 12px;
            background: linear-gradient(135deg, #d4af37, #8a6d1f);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; color: #1a1a1a; font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(212,175,55,0.4);
        }
        .app-header .brand .brand-text { display: flex; flex-direction: column; }
        .app-header .brand .brand-text .name { font-size: 1rem; font-weight: 800; color: #fff; letter-spacing: 0.5px; }
        .app-header .brand .brand-text .sub { font-size: 0.65rem; color: #d4af37; letter-spacing: 2px; text-transform: uppercase; }
        .app-header .live-badge {
            display: flex; align-items: center; gap: 6px;
            padding: 6px 14px; border-radius: 20px;
            font-size: 0.7rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s;
        }
        .app-header .live-badge.live { background: rgba(255,77,77,0.2); color: #ff4d4d; border: 1px solid rgba(255,77,77,0.5); }
        .app-header .live-badge.off { background: rgba(150,150,150,0.15); color: #aaa; border: 1px solid rgba(150,150,150,0.4); }
        .app-header .live-badge .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
        .app-header .live-badge.live .dot { animation: blink 1.2s infinite; }
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

        .live-section {
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
            flex: 1;
            padding: 20px 0;
            gap: 25px;
        }
        .app-container.mode-live .live-section { display: flex; }
        .app-container.mode-live .off-section { display: none; }

        .live-title { text-align: center; }
        .live-title h2 {
            font-size: 1.8rem; font-weight: 900; color: #fff;
            margin-bottom: 5px; letter-spacing: -0.5px;
        }
        .live-title .live-sub {
            font-size: 0.8rem; color: #d4af37; letter-spacing: 3px;
            text-transform: uppercase; font-weight: 700;
        }
        .live-indicator-big {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 20px; border-radius: 30px;
            background: rgba(255,77,77,0.2); color: #ff4d4d;
            border: 1px solid rgba(255,77,77,0.5);
            font-size: 0.85rem; font-weight: 800;
            letter-spacing: 2px; text-transform: uppercase;
            animation: pulseLiveBig 1.5s infinite;
        }
        @keyframes pulseLiveBig {
            0%,100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.5); }
            50% { box-shadow: 0 0 0 15px rgba(255,77,77,0); }
        }
        .live-indicator-big .dot {
            width: 10px; height: 10px; border-radius: 50%; background: #ff4d4d;
            animation: blink 1s infinite;
        }

        .caster-container {
            width: 100%; max-width: 340px;
            display: flex; justify-content: center; align-items: center;
            padding: 25px 20px;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            border: 1px solid rgba(212,175,55,0.3);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 30px rgba(212,175,55,0.15);
        }

        .live-animation {
            display: flex; align-items: flex-end; gap: 5px; height: 50px;
        }
        .live-animation span {
            width: 6px;
            background: linear-gradient(to top, #d4af37, #ff4d4d);
            border-radius: 3px;
            animation: liveBounce 1s ease-in-out infinite;
        }
        .live-animation span:nth-child(1) { animation-delay: 0s; }
        .live-animation span:nth-child(2) { animation-delay: 0.1s; }
        .live-animation span:nth-child(3) { animation-delay: 0.2s; }
        .live-animation span:nth-child(4) { animation-delay: 0.3s; }
        .live-animation span:nth-child(5) { animation-delay: 0.4s; }
        .live-animation span:nth-child(6) { animation-delay: 0.5s; }
        .live-animation span:nth-child(7) { animation-delay: 0.6s; }
        @keyframes liveBounce {
            0%,100% { height: 8px; }
            50% { height: 50px; }
        }

        .off-section {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .album-section {
            flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px 0; min-height: 0;
        }
        .album-disc {
            position: relative;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a24, #0f0f16);
            border: 3px solid rgba(212,175,55,0.3);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 40px rgba(212,175,55,0.15);
            transition: all 0.5s ease;
            margin-bottom: 30px;
        }
        .album-disc::before {
            content: ''; position: absolute; inset: 15px;
            border-radius: 50%; border: 1px dashed rgba(212,175,55,0.2);
        }
        .album-disc::after {
            content: ''; position: absolute; inset: 40px;
            border-radius: 50%; border: 1px solid rgba(212,175,55,0.1);
        }
        .album-disc .disc-center {
            width: 80px; height: 80px; border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #8a6d1f);
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; color: #1a1a1a; font-size: 1.5rem;
            box-shadow: 0 0 30px rgba(212,175,55,0.5);
            z-index: 2;
        }
        .app-container.playing .album-disc {
            animation: spinDisc 8s linear infinite;
            border-color: #d4af37;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), 0 0 60px rgba(212,175,55,0.4);
        }
        @keyframes spinDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .track-info { text-align: center; padding: 0 20px; max-width: 100%; }
        .track-info .track-title {
            font-size: 1.3rem; font-weight: 800; color: #fff; margin-bottom: 6px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .track-info .track-artist {
            font-size: 0.85rem; color: #d4af37; letter-spacing: 2px;
            text-transform: uppercase; font-weight: 600;
        }

        .big-equalizer {
            display: none;
            align-items: flex-end;
            justify-content: center;
            gap: 4px;
            height: 40px;
            margin: 15px auto;
        }
        .app-container.playing .big-equalizer { display: flex; }
        .big-equalizer span {
            width: 6px;
            background: linear-gradient(to top, #d4af37, #f7e38a);
            border-radius: 3px;
            animation: bigBounce 0.9s ease-in-out infinite;
        }
        .big-equalizer span:nth-child(1) { animation-delay: 0s; }
        .big-equalizer span:nth-child(2) { animation-delay: 0.1s; }
        .big-equalizer span:nth-child(3) { animation-delay: 0.2s; }
        .big-equalizer span:nth-child(4) { animation-delay: 0.3s; }
        .big-equalizer span:nth-child(5) { animation-delay: 0.15s; }
        .big-equalizer span:nth-child(6) { animation-delay: 0.25s; }
        .big-equalizer span:nth-child(7) { animation-delay: 0.05s; }
        @keyframes bigBounce {
            0%,100% { height: 8px; }
            50% { height: 40px; }
        }

        .player-controls {
            display: flex; align-items: center; justify-content: center;
            gap: 25px; padding: 25px 0; flex-shrink: 0;
        }
        .ctrl-btn {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(212,175,55,0.3);
            color: #d4af37;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; font-size: 1.2rem;
        }
        .ctrl-btn:hover { background: rgba(212,175,55,0.15); transform: scale(1.1); }
        .ctrl-btn:active { transform: scale(0.95); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .play-btn {
            width: 75px; height: 75px;
            background: linear-gradient(135deg, #d4af37, #b8942e);
            border: none; color: #1a1a1a; font-size: 1.8rem;
            box-shadow: 0 10px 30px rgba(212,175,55,0.5);
        }
        .play-btn:hover { transform: scale(1.08); box-shadow: 0 15px 40px rgba(212,175,55,0.7); }
        .play-btn.playing { animation: pulseBtn 2s infinite; }
        @keyframes pulseBtn {
            0%,100% { box-shadow: 0 10px 30px rgba(212,175,55,0.5); }
            50% { box-shadow: 0 10px 50px rgba(212,175,55,0.9), 0 0 0 10px rgba(212,175,55,0.1); }
        }

        .playlist-section { padding: 15px 0; flex-shrink: 0; }
        .playlist-title {
            font-size: 0.75rem; color: #d4af37; letter-spacing: 2px;
            text-transform: uppercase; font-weight: 700;
            margin-bottom: 12px; padding-left: 5px;
        }
        .playlist {
            max-height: 180px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px;
        }
        .playlist::-webkit-scrollbar { width: 4px; }
        .playlist::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 2px; }
        .playlist-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; border-radius: 12px;
            background: rgba(255,255,255,0.03);
            cursor: pointer; transition: all 0.2s;
            border: 1px solid transparent;
        }
        .playlist-item:hover { background: rgba(212,175,55,0.08); }
        .playlist-item.active { background: rgba(212,175,55,0.15); border-color: rgba(212,175,55,0.4); }
        .playlist-item .item-icon {
            width: 35px; height: 35px; border-radius: 50%;
            background: rgba(212,175,55,0.15);
            display: flex; align-items: center; justify-content: center;
            color: #d4af37; font-size: 0.9rem; flex-shrink: 0;
        }
        .playlist-item.active .item-icon { background: #d4af37; color: #1a1a1a; }
        .playlist-item .item-info { flex: 1; overflow: hidden; }
        .playlist-item .item-info h4 {
            font-size: 0.85rem; color: #fff; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .playlist-item .item-info small { font-size: 0.7rem; color: #888; }
        .playlist-item .playing-indicator {
            display: none; gap: 2px; align-items: flex-end; height: 16px;
        }
        .playlist-item.active .playing-indicator { display: flex; }
        .playing-indicator span {
            width: 3px; background: #d4af37; border-radius: 2px;
            animation: miniBounce 0.8s ease-in-out infinite;
        }
        .playing-indicator span:nth-child(1) { animation-delay: 0s; }
        .playing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .playing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes miniBounce { 0%,100%{height:5px} 50%{height:16px} }

        .bible-fab {
            position: relative;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            margin: 15px 0 5px; padding: 16px 30px;
            background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
            border: 2px solid rgba(212,175,55,0.5); border-radius: 50px;
            color: #d4af37; text-decoration: none;
            font-size: 0.95rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            transition: all 0.3s; overflow: hidden; flex-shrink: 0;
        }
        .bible-fab::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
            transform: translateX(-100%); transition: transform 0.6s;
        }
        .bible-fab:hover {
            background: linear-gradient(135deg, #d4af37, #b8942e);
            color: #1a1a1a; transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(212,175,55,0.5);
        }
        .bible-fab:hover::before { transform: translateX(100%); }
        .bible-fab .icon { font-size: 1.4rem; filter: drop-shadow(0 0 5px currentColor); }

        .bottom-nav {
            display: flex; justify-content: space-around; align-items: center;
            padding: 12px 0; background: rgba(15,15,22,0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(212,175,55,0.2); flex-shrink: 0;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            color: #666; text-decoration: none;
            font-size: 0.65rem; letter-spacing: 1px; text-transform: uppercase;
            transition: all 0.3s; padding: 5px 15px; cursor: pointer;
            background: none; border: none;
        }
        .nav-item .nav-icon { font-size: 1.2rem; }
        .nav-item:hover, .nav-item.active { color: #d4af37; }
        .nav-item.active .nav-icon { filter: drop-shadow(0 0 8px #d4af37); }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .app-content > * { animation: fadeInUp 0.6s ease backwards; }
        .app-header { animation-delay: 0.1s; }

        @media (min-width: 481px) {
            body { display: flex; align-items: center; justify-content: center; padding: 20px; background: #050508; }
            .app-container {
                border-radius: 40px;
                box-shadow: 0 0 100px rgba(212,175,55,0.1), 0 0 200px rgba(0,0,0,0.9);
                border: 8px solid #1a1a24;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container" id="appContainer">

        <div class="animated-bg">
            <div class="bg-orb orb-1"></div>
            <div class="bg-orb orb-2"></div>
            <div class="bg-orb orb-3"></div>
            <div class="wave-rings">
                <div class="wave-ring"></div>
                <div class="wave-ring"></div>
                <div class="wave-ring"></div>
                <div class="wave-ring"></div>
            </div>
            <div class="bg-equalizer">
                <div class="bg-bar"></div><div class="bg-bar"></div><div class="bg-bar"></div>
                <div class="bg-bar"></div><div class="bg-bar"></div><div class="bg-bar"></div>
                <div class="bg-bar"></div><div class="bg-bar"></div><div class="bg-bar"></div>
            </div>
        </div>

        <div class="app-content">

            <header class="app-header">
                <div class="brand">
                    <div class="logo-mini">IT</div>
                    <div class="brand-text">
                        <span class="name">Radio Tacachira</span>
                        <span class="sub">Iglesia</span>
                    </div>
                </div>
                <div class="live-badge off" id="liveBadge">
                    <span class="dot"></span>
                    <span id="liveText">OFF</span>
                </div>
            </header>

            <div class="live-section" id="liveSection">
                <div class="live-title">
                    <h2>Estamos EN VIVO</h2>
                    <div class="live-sub">Transmisión en directo</div>
                </div>
                <div class="live-indicator-big">
                    <span class="dot"></span>
                    EN VIVO
                </div>
                <div class="caster-container" id="casterContainer"></div>
                <div class="live-animation">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span>
                </div>
            </div>

            <div class="off-section" id="offSection">
                <div class="album-section">
                    <div class="album-disc">
                        <div class="disc-center" id="discCenter">IT</div>
                    </div>
                    <div class="track-info">
                        <div class="track-title" id="trackTitle">Radio Tacachira</div>
                        <div class="track-artist" id="trackArtist">Selecciona una canción</div>
                    </div>
                    <div class="big-equalizer">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span>
                    </div>
                </div>

                <div class="player-controls">
                    <button class="ctrl-btn" id="prevBtn" title="Anterior">⏮</button>
                    <button class="ctrl-btn play-btn" id="playBtn" title="Reproducir">▶</button>
                    <button class="ctrl-btn" id="nextBtn" title="Siguiente">⏭</button>
                </div>

                <div class="playlist-section">
                    <div class="playlist-title">🎵 Lista de reproducción</div>
                    <div class="playlist" id="playlist">
                        <div style="text-align:center;color:#666;padding:20px;font-size:0.85rem;">Cargando...</div>
                    </div>
                </div>
            </div>

            <a href="bibliaapp.html" class="bible-fab">
                <span class="icon">📖</span>
                <span>Leer la Biblia</span>
            </a>
        </div>

        <nav class="bottom-nav">
            <a href="radio.html" class="nav-item">
                <span class="nav-icon">🏠</span>
                <span>Inicio</span>
            </a>
            <button class="nav-item active">
                <span class="nav-icon">📻</span>
                <span>Radio</span>
            </button>
            <a href="bibliaapp.html" class="nav-item">
                <span class="nav-icon">📖</span>
                <span>Biblia</span>
            </a>
        </nav>

        <audio id="audioPlayer" preload="none"></audio>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

        // 🔴 NUEVA CONFIGURACIÓN DE FIREBASE (radio-tacachira)
        const firebaseConfig = {
            apiKey: "AIzaSyDlVEJSSziX4MXsUho76UUg-DTCTfTDZ4o",
            authDomain: "radio-tacachira.firebaseapp.com",
            databaseURL: "https://radio-tacachira-default-rtdb.firebaseio.com",
            projectId: "radio-tacachira",
            storageBucket: "radio-tacachira.firebasestorage.app",
            messagingSenderId: "329155628232",
            appId: "1:329155628232:web:775b8e922220d9961de9fd",
            measurementId: "G-JSGV0KZSRC"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const RADIO_PATH = 'radio_control';

        const appContainer = document.getElementById('appContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const trackTitle = document.getElementById('trackTitle');
        const trackArtist = document.getElementById('trackArtist');
        const playlist = document.getElementById('playlist');
        const liveBadge = document.getElementById('liveBadge');
        const liveText = document.getElementById('liveText');
        const casterContainer = document.getElementById('casterContainer');
        const discCenter = document.getElementById('discCenter');

        let musicLinks = [];
        let currentIndex = -1;
        let currentMode = 'off';
        let isPlaying = false;

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        const radioRef = ref(db, RADIO_PATH);
        onValue(radioRef, (snapshot) => {
            const data = snapshot.val() || {};
            currentMode = data.mode || 'off';
            musicLinks = data.musicLinks ? Object.values(data.musicLinks) : [];
            updateUI();
        });

        function updateUI() {
            if (currentMode === 'live') {
                appContainer.classList.add('mode-live');
                appContainer.classList.remove('playing');
                liveBadge.className = 'live-badge live';
                liveText.textContent = 'EN VIVO';
                
                // 🔴 NUEVO EMBED DE CASTER.FM
                if (!casterContainer.querySelector('.cstrEmbed')) {
                    casterContainer.innerHTML = `
                        <div data-type="newStreamPlayer" data-publicToken="68656bf2-77dd-4d38-b853-5246b5d0981e" data-theme="light" data-color="e81e4d" data-channelId="" data-rendered="false" class="cstrEmbed">
                            <a href="https://www.caster.fm">Shoutcast Hosting</a>
                            <a href="https://www.caster.fm">Stream Hosting</a>
                            <a href="https://www.caster.fm">Radio Server Hosting</a>
                        </div>
                    `;
                    if (!document.querySelector('script[src*="caster.fm/widgets/embed.js"]')) {
                        const s = document.createElement('script');
                        s.src = 'https://cdn.cloud.caster.fm/widgets/embed.js';
                        document.body.appendChild(s);
                    }
                }
                
                audioPlayer.pause();
                isPlaying = false;
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
            } else {
                appContainer.classList.remove('mode-live');
                liveBadge.className = 'live-badge off';
                liveText.textContent = 'OFF';
                casterContainer.innerHTML = '';
                
                renderPlaylist();
                
                if (currentIndex >= 0 && musicLinks[currentIndex]) {
                    const song = musicLinks[currentIndex];
                    trackTitle.textContent = song.title || 'Sin título';
                    trackArtist.textContent = 'Radio Tacachira';
                    discCenter.textContent = '🎵';
                } else {
                    trackTitle.textContent = 'Radio Tacachira';
                    trackArtist.textContent = 'Selecciona una canción';
                    discCenter.textContent = 'IT';
                }
            }
        }

        function renderPlaylist() {
            if (!musicLinks || musicLinks.length === 0) {
                playlist.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:0.85rem;">🎵 No hay canciones disponibles</div>';
                return;
            }
            playlist.innerHTML = musicLinks.map((link, index) => `
                <div class="playlist-item ${index === currentIndex ? 'active' : ''}" onclick="playSong(${index})">
                    <div class="item-icon">${index === currentIndex && isPlaying ? '⏸' : '▶'}</div>
                    <div class="item-info">
                        <h4>${escapeHtml(link.title || 'Sin título')}</h4>
                        <small>Canción ${index + 1} de ${musicLinks.length}</small>
                    </div>
                    <div class="playing-indicator">
                        <span></span><span></span><span></span>
                    </div>
                </div>
            `).join('');
        }

        window.playSong = function(index) {
            if (currentMode === 'live') return;
            if (index < 0 || index >= musicLinks.length) return;
            
            if (currentIndex === index && isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                appContainer.classList.remove('playing');
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
                renderPlaylist();
                return;
            }
            
            currentIndex = index;
            const song = musicLinks[index];
            audioPlayer.src = song.url;
            audioPlayer.load();
            audioPlayer.play().then(() => {
                isPlaying = true;
                appContainer.classList.add('playing');
                playBtn.textContent = '⏸';
                playBtn.classList.add('playing');
                trackTitle.textContent = song.title || 'Sin título';
                trackArtist.textContent = 'Radio Tacachira';
                discCenter.textContent = '🎵';
                renderPlaylist();
            }).catch(err => {
                console.error('Error:', err);
                alert('No se pudo reproducir la canción');
            });
        };

        playBtn.addEventListener('click', () => {
            if (currentMode === 'live') return;
            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                appContainer.classList.remove('playing');
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
                renderPlaylist();
            } else {
                if (currentIndex >= 0 && musicLinks[currentIndex]) {
                    audioPlayer.play().then(() => {
                        isPlaying = true;
                        appContainer.classList.add('playing');
                        playBtn.textContent = '⏸';
                        playBtn.classList.add('playing');
                        renderPlaylist();
                    });
                } else if (musicLinks.length > 0) {
                    playSong(0);
                }
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentMode === 'live' || musicLinks.length === 0) return;
            const newIndex = currentIndex <= 0 ? musicLinks.length - 1 : currentIndex - 1;
            playSong(newIndex);
        });

        nextBtn.addEventListener('click', () => {
            if (currentMode === 'live' || musicLinks.length === 0) return;
            const newIndex = currentIndex >= musicLinks.length - 1 ? 0 : currentIndex + 1;
            playSong(newIndex);
        });

        audioPlayer.addEventListener('ended', () => {
            if (musicLinks.length > 0) {
                const newIndex = currentIndex >= musicLinks.length - 1 ? 0 : currentIndex + 1;
                playSong(newIndex);
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                appContainer.classList.remove('playing');
                playBtn.textContent = '▶';
                playBtn.classList.remove('playing');
            }
        });
    </script>
</body>
</html>
